name: Update market data and publish
on:
  schedule:
    # UTC 10:00 = Asia/Shanghai 18:00, Monday-Friday.
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: financial-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore latest published snapshot
        run: |
          pip install requests
          python scripts/market_data.py restore
      - name: Update quarter-end and latest market data
        if: github.event_name != 'push'
        run: |
          python scripts/market_data.py
      - name: Save only new quarter-end checkpoints
        if: github.event_name != 'push'
        run: |
          python scripts/market_data.py checkpoint
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market_archive.json data/market_dividends_archive.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive completed quarter-end market data'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir _site
          cp *.html *.js *.css *.svg manifest.webmanifest .nojekyll _site/
          mkdir _site/data
          find data -maxdepth 1 -type f ! -name '*_archive.json' -exec cp {} _site/data/ \;
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
