name: Update market data and publish
on:
  schedule:
    # UTC 10:00 = Asia/Shanghai 18:00, Monday-Friday.
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled, transferred]
  push:
    branches: [main]
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
  issues: read
concurrency:
  group: financial-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'issues' || github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore latest published snapshot
        run: |
          pip install requests beautifulsoup4
          python scripts/market_data.py restore
      - name: Update commodities and preserve daily history
        if: github.event_name != 'issues'
        run: |
          python scripts/test_commodity_data.py
          python scripts/commodity_data.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/commodities.json data/commodity_*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update commodity history and percentile screening'
            git push
          fi
      - name: Update public steel fundamentals
        if: github.event_name != 'issues'
        timeout-minutes: 4
        run: |
          python scripts/steel_indicators.py
          git add data/steel_indicators.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public steel fundamentals'
            git push
          fi
      - name: Update and archive official Shenwan daily indices
        if: github.event_name != 'issues'
        timeout-minutes: 5
        run: |
          python scripts/shenwan_data.py
          git add data/shenwan*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official Shenwan index history'
            git push
          fi
      - name: Update quarter-end and latest market data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/market_data.py
      - name: Save only new quarter-end checkpoints
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/market_data.py checkpoint
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market_archive.json data/market_dividends_archive.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive completed quarter-end market data'
            git push
          fi
      - name: Export owner notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/export_notes.py
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir _site
          cp *.html *.js *.css *.svg manifest.webmanifest .nojekyll _site/
          mkdir _site/data
          find data -maxdepth 1 -type f ! -name '*_archive.json' -exec cp {} _site/data/ \;
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1
      - name: Wait for the Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..15}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '.artifacts[] | select(.expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact is still missing from the Actions API"
          exit 1
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
